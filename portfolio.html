<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Anika's Portfolio</title>
  <style>
    /* Navigation CSS elements */
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    body {
      /* Sky Background */
      background: linear-gradient(to bottom, #87CEEB 0%, #e0f6ff 100%);
      min-height: 100vh;
      overflow-x: hidden; /* Prevents horizontal scroll from clouds */
    }

    .container {
      width: 100%;
      min-height: 100vh;
      position: relative;
      z-index: 10; /* Keeps content above clouds */
    }

    .navbar {
      height: 60px;
      min-width: 700px;
      width: 100%;
      padding-top: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .nav--list {
      list-style: none;
      position: relative;
      width: 80%; /* Adjusted for better look */
      max-width: 900px;
      height: 50px;
      display: flex;
      border-radius: 50px;
      justify-content: space-evenly;
      align-items: center;
      background: #fcffcb;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .active {
      position: absolute;
      width: 120px;
      height: 40px;
      background: #00bfb2;
      border-radius: 50px;
      transition: left 300ms cubic-bezier(1, -0.5, 0, 1.5);
      border-top: 1px solid #000;
      border-bottom: 1px solid #000;
      border-left: 5px solid #404239;
      border-right: 5px solid #404239;
    }

    .item {
      height: 100%;
      width: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .item a {
      text-decoration: none;
      text-transform: uppercase;
      font-size: 13px;
      font-weight: bold;
      color: #404239; /* Changed to dark for readability */
      z-index: 20;
    }

    /* --- Cloud animation --- */

    .cloud-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1; /* Puts clouds behind everything */
      pointer-events: none; /* Clicking passes through clouds */
      overflow: hidden;
    }

    .cloud {
      position: absolute;
      fill: white;
      opacity: 0.8;
      filter: drop-shadow(0 5px 15px rgba(255,255,255,0.3));
      animation: drift linear infinite;
    }

    /* Define Cloud Sizes and Speeds */
    .cloud-1 { top: 10%; width: 200px; animation-duration: 45s; animation-delay: -5s; }
    .cloud-2 { top: 25%; width: 150px; animation-duration: 35s; animation-delay: -15s; }
    .cloud-3 { top: 45%; width: 250px; animation-duration: 55s; animation-delay: -25s; }
    .cloud-4 { top: 70%; width: 180px; animation-duration: 40s; animation-delay: -10s; }

    @keyframes drift {
      from {
        transform: translateX(-300px); /* Start off-screen left */
      }
      to {
        transform: translateX(110vw); /* End off-screen right */
      }
    }

    /* End of cloud styles */

  </style>
</head>

  <script>
    const items = document.querySelectorAll(".item");
    const active = document.querySelector(".active");

    (function reset() {
      active.style.left = `${items[0].offsetLeft}px`;
    })();

    items.forEach((elem) => {
      elem.addEventListener("click", (e) => {
        active.style.left = `${elem.offsetLeft}px`;
      });
    });
  </script>
